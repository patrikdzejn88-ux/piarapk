workflows:
  android-release:
    name: Flutter Android (APK)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.47.5
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - ~/.cargo
        - rust/target
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Install Rust + cargo-ndk
        script: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked

      - name: Setup Android NDK (r27+, 16KB page)
        script: |
          set -e
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          # ищем sdkmanager
          SDKM=""
          for c in cmdline-tools/latest/bin/sdkmanager cmdline-tools/bin/sdkmanager tools/bin/sdkmanager; do
            if [ -x "$ANDROID_SDK_ROOT/$c" ]; then SDKM="$ANDROID_SDK_ROOT/$c"; break; fi
          done
          if [ -z "$SDKM" ]; then
            SDKM=$(find "$ANDROID_SDK_ROOT" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "$SDKM" ]; then
            echo "sdkmanager: $SDKM"
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            # всегда ставим r27+ (16KB page support); ранний выход по
            # существующему NDK убран — r25 даёт 4KB-выравнивание
            "$SDKM" "ndk;27.0.12077973" >/dev/null || echo "WARN: NDK 27 не установился — fallback на существующий"
          else
            echo "WARN: sdkmanager не найден — fallback на существующий NDK"
          fi
          echo "NDK present: $(ls "$ANDROID_SDK_ROOT/ndk/" 2>/dev/null || echo none)"

      - name: Rust unit tests
        script: |
          source "$HOME/.cargo/env"
          cargo test --manifest-path rust/Cargo.toml

      - name: Build Rust .so for Android (jniLibs)
        script: |
          set -e
          source "$HOME/.cargo/env"
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/share/android-sdk}"
          # предпочитаем r27 (16KB page), fallback — любой установленный
          NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          if [ ! -d "$NDK_DIR" ]; then NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT/ndk/"*/ 2>/dev/null | head -n 1); fi
          if [ -z "$NDK_DIR" ]; then echo "NDK не найден" >&2; exit 1; fi
          echo "NDK: $NDK_DIR"
          export ANDROID_NDK_HOME="$NDK_DIR"
          export NDK_HOME="$NDK_DIR"
          # 16KB page alignment (Android 15+ / новые устройства)
          export RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384"
          # cargo-ndk требует запуск из каталога крейта (cargo metadata в cwd)
          cd rust
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ../android/app/src/main/jniLibs \
            build --release
          # ЖЁСТКАЯ ПРОВЕРКА: без .so сборка обязана упасть, а не молча
          # выпустить APK без ядра
          test -f ../android/app/src/main/jniLibs/arm64-v8a/libpiarcore.so || { echo "ОШИБКА: libpiarcore.so (arm64-v8a) не собралась"; exit 1; }
          test -f ../android/app/src/main/jniLibs/armeabi-v7a/libpiarcore.so || { echo "ОШИБКА: libpiarcore.so (armeabi-v7a) не собралась"; exit 1; }
          ls -laR ../android/app/src/main/jniLibs/

      - name: Flutter pub get
        script: flutter pub get

      - name: Flutter analyze
        script: flutter analyze

      - name: Build APK
        script: |
          flutter build apk --release \
            --dart-define=APP_VERSION=1.0.3 \
            --dart-define=BUILD_COMMIT=${CM_COMMIT:-local}

      - name: Verify APK contains libpiarcore.so
        script: |
          set -e
          APK=build/app/outputs/flutter-apk/app-release.apk
          unzip -l "$APK" | grep "lib/arm64-v8a/libpiarcore.so" || { echo "ОШИБКА: в APK нет libpiarcore.so (arm64-v8a)!"; exit 1; }
          unzip -l "$APK" | grep "lib/armeabi-v7a/libpiarcore.so" || { echo "ОШИБКА: в APK нет libpiarcore.so (armeabi-v7a)!"; exit 1; }
          echo "APK содержит libpiarcore.so в обоих ABI ✓"
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
