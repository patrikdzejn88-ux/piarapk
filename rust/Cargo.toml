[package]
name = "piarcore"
version = "0.1.0"
edition = "2021"
description = "Telegram multi-account core (grammers) with C-ABI JSON bridge for piarapk"

[lib]
crate-type = ["cdylib", "lib"]

# NOTE: версии зависимостей сверяются по docs.rs/crates.io в CI-цикле.
[dependencies]
grammers-client = "0.10"
grammers-session = { version = "0.10", features = ["sqlite-storage"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
ige = "0.4"
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
libc = "0.2"
