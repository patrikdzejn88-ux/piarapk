[package]
name = "piarcore"
version = "0.1.0"
edition = "2021"
description = "Telegram multi-account core (grammers) with C-ABI JSON bridge for piarapk"

[lib]
crate-type = ["cdylib", "lib"]

# Версии зависимостей сверены с docs.rs/crates.io (проверка агента 27.09.2026).
[dependencies]
grammers-client = "0.10"
grammers-session = "0.10"
grammers-mtsender = "0.10"
grammers-tl-types = "0.10"
# ПИН: grammers-crypto 0.10 требует glass_pumpkin ^2.0.0-rc0, но rc1
# (02.09.2026) переехал на num-bigint 0.5 и ломает сборку grammers-crypto.
# Фиксируем rc0 — cargo унифицирует с требованиями grammers-crypto.
glass_pumpkin = "=2.0.0-rc0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
log = "0.4"
once_cell = "1"
parking_lot = "0.12"
ige = "0.1"
aes = "0.8"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
hex = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
